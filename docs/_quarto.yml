project:
  type: website
  output-dir: _site
  resources:
    - images/posit-logo.svg

website:
  title: "jupyter-positron-server"
  description: "Run Positron Server in JupyterHub"
  page-navigation: true
  page-footer:
    center: |
      Proudly supported by
      [![](images/posit-logo.svg){fig-alt="Posit PBC" width=65px}](https://posit.co/)
  navbar:
    background: light
    pinned: true
    left:
      - text: "Get started"
        file: get_started.qmd
      - text: "Deployment"
        menu:
          - text: "Configuration"
            file: configuration.qmd
          - text: "Templates"
            file: deployment.qmd
      - text: "Troubleshooting"
        file: troubleshooting.qmd
      - text: "Reference"
        file: reference/index.qmd
    right:
      - icon: github
        href: https://github.com/posit-dev/jupyter-positron-server
        aria-label: jupyter-positron-server GitHub

format:
  html:
    theme: cosmo
    toc: true

quartodoc:
  title: Reference
  package: jupyter_positron_server
  sections:
    - title: Setup Functions
      desc: "Functions to configure the Positron server proxy"
      contents:
        - setup_positron_server
        - which_positron_server

filters:
  - interlinks

interlinks:
  sources: {}
