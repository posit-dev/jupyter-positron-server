# ALTERNATIVE license delivery: a Kubernetes Secret you manage yourself.
#
# Use this INSTEAD OF the `singleuser.extraFiles` block in values.yaml — both
# would mount at the same path. Reach for it when the Secret's lifecycle is
# owned elsewhere: external-secrets, sealed-secrets, an existing Secret, or a
# rotation process outside Helm.
#
#   kubectl -n jupyterhub create secret generic positron-license \
#     --from-file=license.lic=./license.lic
#
#   helm upgrade --install positron jupyterhub/jupyterhub \
#     --version 4.4.1 --namespace jupyterhub \
#     --values values.yaml --values values-secret-alternative.yaml
#
# Trade-off versus extraFiles: you must write `subPath` yourself, and getting it
# wrong is the single most damaging mistake in this deployment (see README.md).
# extraFiles derives subPath automatically, which is why it is the default.

singleuser:
  # Removes the extraFiles entry inherited from values.yaml — without this the
  # chart fails to render on this path, since that entry only receives content
  # from --set-file, which this path does not use.
  extraFiles: null

  # Note the nesting: for user pods these live under `storage`, unlike the Hub
  # where they would be `hub.extraVolumes` at the top level.
  storage:
    extraVolumes:
      - name: positron-license
        secret:
          secretName: positron-license
          # 0440 is explicit and self-documenting. In practice the chart's
          # default `singleuser.fsGid: 100` also causes kubelet to grant group
          # read, so 0400 happens to work too — but do not rely on that.
          defaultMode: 0440

    extraVolumeMounts:
      - name: positron-license
        # mountPath is the FULL FILE PATH and subPath is REQUIRED.
        #
        # Mounting at the directory instead replaces it entirely: license-manager,
        # librclient.so, librserver.so and license-manager.conf all disappear,
        # Positron restart-loops, and the failure is reported as a generic
        # timeout with a misleading "No license key provided" in the pod log.
        #
        # Remember to match the architecture directory to your nodes
        # (x86_64 for amd64, aarch64 for arm64).
        mountPath: /opt/positron-server/resources/activation/linux/x86_64/license.lic
        subPath: license.lic
        readOnly: true
